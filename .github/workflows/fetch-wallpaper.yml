name: Fetch daily wallpaper

on:
  workflow_dispatch:
    inputs:
      trigger:
        description: Run mode
        type: choice
        default: manual
        options:
          - manual
          - external-cron

      target_environment:
        description: Push target environment
        required: true
        default: test
        type: choice
        options:
          - test
          - production

      market:
        description: Bing market
        required: true
        default: en-US
        type: choice
        options:
          - zh-CN
          - en-US
          - ja-JP
          - it-IT
          - es-ES

      force:
        description: Force refresh even when wallpaper data is unchanged
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: wallpaper-feed
  cancel-in-progress: false

jobs:
  fetch:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      feed_commit: ${{ steps.feed_commit.outputs.sha }}
    env:
      MARKETS: ${{ inputs.trigger == 'external-cron' && 'zh-CN en-US ja-JP it-IT es-ES' || inputs.market }}
    steps:
      - name: Check out latest default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Fetch wallpaper
        env:
          FORCE: ${{ inputs.trigger != 'external-cron' && inputs.force }}
        run: |
          read -r -a markets <<< "$MARKETS"
          for market in "${markets[@]}"; do
            args=("$market")
            if [ "$FORCE" = "true" ]; then
              args+=(--force)
            fi
            node scripts/fetch-wallpaper.mjs "${args[@]}"
          done

      - name: Commit updated feed
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add data/latest.json
          if git diff --cached --quiet; then
            echo "Wallpaper feed unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update ${MARKETS} wallpaper"
          git push origin "HEAD:${DEFAULT_BRANCH}"

      - name: Record feed commit
        id: feed_commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  push:
    name: Push to ${{ matrix.environment }}
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(inputs.trigger == 'external-cron' && '["test", "production"]' || format('["{0}"]', inputs.target_environment)) }}
    environment:
      name: ${{ matrix.environment }}
    steps:
      # Environment variables are available after the job starts.
      - name: Check push switch
        id: push_switch
        env:
          TRIGGER: ${{ inputs.trigger }}
          SCHEDULE_PUSH_ENABLED: ${{ vars.SCHEDULE_PUSH_ENABLED }}
        run: |
          if [ "$TRIGGER" != "external-cron" ] || [ "$SCHEDULE_PUSH_ENABLED" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Scheduled push disabled for this environment"
          fi

      - name: Check out collected feed
        if: steps.push_switch.outputs.enabled == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.fetch.outputs.feed_commit }}
          persist-credentials: false

      - name: Set up Node.js
        if: steps.push_switch.outputs.enabled == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Push wallpaper
        if: steps.push_switch.outputs.enabled == 'true'
        env:
          WALLPAPER_PUSH_URL: ${{ secrets.WALLPAPER_PUSH_URL }}
          WALLPAPER_APP_ID: ${{ secrets.WALLPAPER_APP_ID }}
          WALLPAPER_APP_SECRET: ${{ secrets.WALLPAPER_APP_SECRET }}
        run: node scripts/push-wallpaper.mjs
